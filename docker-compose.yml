# Local development services. Run: docker compose up -d postgres redis
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cataloglink
      POSTGRES_PASSWORD: cataloglink
      POSTGRES_DB: cataloglink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cataloglink"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
